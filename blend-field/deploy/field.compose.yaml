services:
  field:
    build:
      context: ../field
      args:
        EXPO_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?Set Supabase URL}
        EXPO_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?Set Supabase anon key}
    restart: unless-stopped
    networks: [proxy]
    labels:
      - traefik.enable=true
      - traefik.docker.network=root_default
      - traefik.http.routers.blend-job-cards-field.rule=Host(`jobcards-field.srv938083.hstgr.cloud`)
      - traefik.http.routers.blend-job-cards-field.entrypoints=websecure
      - traefik.http.routers.blend-job-cards-field.tls.certresolver=mytlschallenge
      - traefik.http.services.blend-job-cards-field.loadbalancer.server.port=80
networks:
  proxy:
    external: true
    name: root_default
