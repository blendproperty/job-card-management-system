services:
  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?Set Supabase URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?Set Supabase anon key}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?Set Supabase URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?Set Supabase anon key}
      SUPABASE_AUTH_ADMIN_KEY: ${SUPABASE_AUTH_ADMIN_KEY:-}
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=root_default
      - traefik.http.routers.blend-job-cards.rule=Host(`${APP_HOST:?Set app host}`)
      - traefik.http.routers.blend-job-cards.entrypoints=websecure
      - traefik.http.routers.blend-job-cards.tls=true
      - traefik.http.routers.blend-job-cards.tls.certresolver=mytlschallenge
      - traefik.http.services.blend-job-cards.loadbalancer.server.port=3000
networks:
  proxy:
    external: true
    name: root_default
