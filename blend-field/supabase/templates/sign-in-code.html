<!doctype html>
<html lang="en">
  <body style="margin:0;background:#f4f6f6;font-family:Figtree,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#082121">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:32px 16px">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;background:#ffffff;border-radius:16px;padding:28px">
            <tr><td style="font-size:18px;font-weight:700;padding-bottom:20px">
              <span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:#39eae6;margin-right:8px"></span>Blend Field
            </td></tr>
            <tr><td style="font-size:16px;line-height:24px;padding-bottom:12px">Your sign-in code:</td></tr>
            <tr><td style="font-size:32px;line-height:40px;font-weight:700;letter-spacing:8px;padding:12px 0 20px">{{ .Token }}</td></tr>
            <tr><td style="font-size:14px;line-height:20px;color:#4f5e5e">
              Type it into Blend Field within 10 minutes. If you didn't ask to sign in, ignore this email. Nobody can get in without the code.
            </td></tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
